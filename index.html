<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ومضات ذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a single-column workbook — sticky stepper on top, one stage per screen, a guiding-questions margin note beside the fields on wide screens */
:root{
  --brand-bg:#0E1A3A; --brand-gold:#E2B85A; --brand-ink:#F3E9D2;
  --bg:#F4F6F3; --surface:#FFFFFF; --ink:#1B2422; --muted:#5D6B67; --line:#D9E0DC;
  --accent:#1F5C57; --accent-soft:#E3EEEC; --wood:#B07A2A; --wood-soft:#F5EBDC;
  --ok:#2E7D4F; --warn:#A8541B;
  --f-display:"Readex Pro","IBM Plex Sans Arabic","IBM Plex Sans Hebrew",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans Hebrew",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211F; --ink:#E6ECE9; --muted:#9DABA6; --line:#2C3835;
  --accent:#6CC3B8; --accent-soft:#1E3330; --wood:#DDA956; --wood-soft:#2E2618;
  --ok:#6FCB93; --warn:#E59A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211F; --ink:#E6ECE9; --muted:#9DABA6; --line:#2C3835;
  --accent:#6CC3B8; --accent-soft:#1E3330; --wood:#DDA956; --wood-soft:#2E2618;
  --ok:#6FCB93; --warn:#E59A62; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.intro{display:grid;gap:8px;margin-bottom:18px}
.intro p{color:var(--muted);max-width:68ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
details.rules{background:var(--wood-soft);border-radius:var(--r);padding:10px 14px}
details.rules summary{cursor:pointer;font-weight:600;color:var(--wood)}
details.rules ol{margin:8px 0 2px;padding-inline-start:20px;display:grid;gap:4px}

.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.stepper ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;min-width:max-content}
.stepper button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px 6px 14px;font:inherit;font-size:.88rem;cursor:pointer}
.stepper button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-family:var(--f-display);font-size:.78rem;font-variant-numeric:tabular-nums}
.stepper button[aria-current="step"]{border-color:var(--accent);color:var(--ink);font-weight:600}
.stepper button[aria-current="step"] .n{background:var(--accent);color:var(--surface)}
.stepper button.done .n{background:var(--accent-soft);color:var(--accent)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
@media (max-width:760px){.stage{grid-template-columns:minmax(0,1fr)}}
.stage-head{grid-column:1/-1;display:grid;gap:4px}
.stage-head p{color:var(--muted);max-width:70ch}
.fields{display:grid;gap:16px;min-width:0}
aside.guide{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;font-size:.92rem}
aside.guide h3{font-size:.85rem;letter-spacing:.02em;color:var(--accent)}
aside.guide ul{margin:0;padding-inline-start:18px;display:grid;gap:6px}
@media (min-width:761px){aside.guide{position:sticky;top:90px}}

.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.94rem}
.field .hint{color:var(--muted);font-size:.84rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
input[type=text],input[type=date],select,textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:var(--muted);opacity:.75}

.ai-row{display:flex;justify-content:flex-end}
.ai-btn{font:inherit;font-size:.82rem;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:3px 12px;cursor:pointer}
.ai-btn[disabled]{opacity:.5;cursor:wait}
.suggest{border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.suggest .s-label{font-size:.8rem;color:var(--accent);font-weight:600}
.suggest .s-text{white-space:pre-wrap}
.suggest .s-actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{font:inherit;font-size:.92rem;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.wood{background:var(--wood);border-color:var(--wood);color:var(--surface);font-weight:600}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.assist{background:var(--surface);border:1px solid var(--wood);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.assist-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.assist-head p{color:var(--muted);font-size:.9rem}
.assist-body{display:grid;gap:14px;border-top:1px dashed var(--line);padding-top:12px}
.assist-steps ol{margin:6px 0 0;padding-inline-start:22px;display:grid;gap:4px}
.sparks{margin:6px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.sparks li{background:var(--wood-soft);border-radius:8px;padding:8px 12px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.86rem;cursor:pointer;background:var(--bg)}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.assist-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ideas{display:grid;gap:12px}
.ideas-qs{background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.ideas-qs ul{margin:4px 0 0;padding-inline-start:18px;display:grid;gap:4px}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.idea{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.idea .meta{font-size:.8rem;color:var(--wood);font-weight:600}
.idea .rev{font-size:.86rem;color:var(--muted)}
.idea .q{font-size:.86rem;border-top:1px dashed var(--line);padding-top:6px}
.idea .use{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.idea .use .btn{font-size:.8rem;padding:4px 10px}
.ideas-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.86rem;color:var(--muted)}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.task h3{display:flex;align-items:center;gap:8px}
.tag{font-size:.75rem;font-family:var(--f-display);background:var(--wood-soft);color:var(--wood);border-radius:999px;padding:1px 10px}

.crit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.crit-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.crit-head .field{flex:1 1 220px}
.crit-head .w{flex:0 0 110px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.levels textarea{min-height:70px}
.lv4 label{color:var(--ok)} .lv1 label{color:var(--warn)}
.both{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.crit-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.weight-sum{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.checks{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:400;cursor:pointer}
.checks input{margin-top:6px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.missing{background:var(--wood-soft);border-radius:8px;padding:10px 14px;font-size:.9rem}
.missing ul{margin:4px 0 0;padding-inline-start:18px}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.out .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.out .card p{color:var(--muted);font-size:.9rem}
.status{font-size:.88rem;min-height:1.4em}
.status.ok{color:var(--ok)} .status.err{color:var(--warn)}

.lbl-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.help-btn{font:inherit;font-size:.78rem;font-weight:500;border:1px solid var(--wood);background:var(--wood-soft);color:var(--wood);border-radius:999px;padding:1px 10px;cursor:pointer;white-space:nowrap}
.help-btn[aria-expanded="true"]{background:var(--wood);color:var(--surface)}
.help{background:var(--wood-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:.88rem;font-weight:400}
.help .ex{background:var(--surface);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.help .ex span{font-size:.75rem;font-weight:600;color:var(--wood)}
.nav{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;margin-top:8px;border-top:1px solid var(--line);padding-top:14px}
.banner{background:var(--wood-soft);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.inline-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.suggest{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}

.top-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.lang-switch{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang-switch .ls-label{font-size:.78rem;color:var(--muted);padding-inline:8px 4px}
.lang-switch button{font:inherit;font-size:.86rem;border:0;background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.lang-switch button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.stu-badge{font-size:.74rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 9px;margin-inline-end:auto}
.lbl-row label{margin-inline-end:auto}.lbl-row .stu-badge+.help-btn{margin-inline-start:0}
.lbl-row:has(.stu-badge) label{margin-inline-end:0}
.langbox{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.check-inline{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.check-inline input{margin-top:6px;accent-color:var(--accent);width:17px;height:17px;flex:none}
textarea.short{min-height:60px}
.trans{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.trans-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.trans-head p{color:var(--muted);font-size:.9rem;max-width:62ch}
.tr-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.tr-src{background:var(--bg);border-radius:8px;padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.tr-lbl{display:block;font-size:.76rem;font-weight:600;color:var(--muted)}
.hint.warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gl-head,.gl-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start}
.gl-head{font-size:.78rem;font-weight:600;color:var(--muted)}
.gl-sug{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.gl-m{color:var(--muted);font-size:.82rem}
@media (max-width:480px){.gl-head{display:none}.gl-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.gl-row .btn{grid-column:1/-1;justify-self:start}}
.fixlang{display:grid;gap:10px}
.fix-list{display:grid;gap:10px;background:var(--surface);border-radius:8px;padding:10px 12px}
.fix-row{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.fix-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.fix-src{background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--muted);overflow-wrap:anywhere}
.task-tr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tr-prev p{overflow-wrap:anywhere}
.brand-band{display:flex;align-items:center;gap:16px;background:var(--brand-bg);color:var(--brand-ink);border-radius:14px;padding:14px 18px;box-shadow:inset 0 0 0 1px rgba(226,184,90,.35)}
.brand-logo{width:88px;height:auto;border-radius:10px;flex:none;max-width:100%}
.brand-text{display:grid;gap:2px;min-width:0}
.intro .brand-band .brand-name{font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--brand-gold);line-height:1.3}
.brand-name span{font-size:.72rem;letter-spacing:.18em;font-weight:600;margin-inline-start:8px;opacity:.85;vertical-align:middle}
.brand-band h1{color:var(--brand-ink);font-size:1.2rem;font-weight:600}
.intro .brand-band 
.intro .brand-band .brand-credit{font-size:.88rem;color:var(--brand-gold)}
.top-row{justify-content:flex-end}
@media (max-width:480px){.brand-band{gap:12px;padding:12px}.brand-logo{width:64px}.brand-name{font-size:1.25rem}.brand-band h1{font-size:1.02rem}}
</style>
<div class="wrap" dir="rtl" lang="ar">
  <header class="intro" id="hdr"></header>
  <nav class="stepper" aria-label="مراحل التخطيط"><ol id="stepper"></ol></nav>
  <form id="form" autocomplete="off" novalidate onsubmit="return false">

    <div class="nav"><button class="btn" type="button" id="prev">السابق</button><button class="btn primary" type="button" id="next">التالي</button></div>
  </form>
</div>

en:{

<script id="builder">
// Builds both Word files. o = {sl: student-file language, tl: teacher-file language, gloss: [[word, arabicMeaning], ...] or null}
function buildDocs(D, s, o){
  const F={ascii:"Arial",hAnsi:"Arial",cs:"Arial"};
  const ACC="1F5C57", GRAY="6B7774";
  // logo in the top-right corner of every page
  const logoBytes=(typeof LOGO_B64==="string"&&LOGO_B64)?Uint8Array.from(atob(LOGO_B64),c=>c.charCodeAt(0)):null;
  const logoHeader=()=>new D.Header({children:[new D.Paragraph({bidirectional:false,alignment:D.AlignmentType.RIGHT,
    children:logoBytes?[new D.ImageRun({data:logoBytes,transformation:{width:70,height:60}})]:[]})]});
  const reEsc=v=>v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const kit=(lang,glossary)=>{
    const rtl=lang!=="en";
    const run=(t,x={})=>new D.TextRun({text:String(t??""),font:F,rightToLeft:x.rtl??rtl,size:x.size||24,sizeComplexScript:x.size||24,bold:!!x.bold,boldComplexScript:!!x.bold,color:x.color});
    // difficult words: the word stays in the subject language, its Arabic meaning follows in small raised grey type (first occurrence per paragraph)
    const G=(glossary||[]).filter(g=>g[0]&&g[0].trim()&&g[1]&&g[1].trim()).map(g=>[g[0].trim(),g[1].trim()]).sort((a,b)=>b[0].length-a[0].length);
    const re=G.length?new RegExp(lang==="en"?`\\b(${G.map(g=>reEsc(g[0])).join("|")})\\b`:`(${G.map(g=>reEsc(g[0])).join("|")})`,lang==="en"?"gi":"g"):null;
    const meaning=w=>{const lw=w.toLowerCase();const g=G.find(g=>g[0].toLowerCase()===lw);return g?g[1]:"";};
    const runsFor=(text,x={})=>{
      text=String(text??"");if(!re)return [run(text,x)];
      const out=[],used=new Set();let last=0,m;re.lastIndex=0;
      while((m=re.exec(text))){const key=m[0].toLowerCase();if(used.has(key))continue;used.add(key);
        if(m.index>last)out.push(run(text.slice(last,m.index),x));
        out.push(new D.TextRun({text:m[0],font:F,rightToLeft:x.rtl??rtl,size:x.size||24,sizeComplexScript:x.size||24,bold:!!x.bold,boldComplexScript:!!x.bold,color:x.color,underline:{type:D.UnderlineType.DOTTED,color:"8A9592"}}));
        const sz=Math.round((x.size||24)*1.5);
        out.push(new D.TextRun({text:"\u2009"+meaning(m[0]),font:F,rightToLeft:true,size:sz,sizeComplexScript:sz,superScript:true,color:GRAY}));
        last=m.index+m[0].length;}
      if(last<text.length)out.push(run(text.slice(last),x));
      return out;};
    const para=(children,x={})=>new D.Paragraph({bidirectional:x.rtl??rtl,children,spacing:{before:x.before||0,after:x.after??120,line:x.line||(re?380:300)},keepNext:x.keepNext});
    const lines=(text,x={})=>{const ls=String(text||"").split(/\n+/).map(v=>v.trim()).filter(Boolean);return (ls.length?ls:[x.empty??"—"]).map(l=>para(runsFor(l,x),x));};
    const h1=t=>para(runsFor(t,{size:36,bold:true,color:ACC}),{after:160});
    const h2=t=>para(runsFor(t,{size:28,bold:true,color:ACC}),{before:280,after:80,keepNext:true});
    const h3=t=>para(runsFor(t,{size:25,bold:true}),{before:200,after:60,keepNext:true});
    const kv=(k,v)=>para([run(k+": ",{bold:true}),run(v||"—")]);
    const cell=(v,c={})=>{
      const kids=lines(v,{size:21,bold:c.head,after:40,line:re?360:260,empty:c.blank?" ":"—"});
      return new D.TableCell({children:kids,shading:c.head?{fill:"E3EEEC",type:D.ShadingType.CLEAR,color:"auto"}:(c.side?{fill:"F5EBDC",type:D.ShadingType.CLEAR,color:"auto"}:undefined),margins:{top:80,bottom:80,left:110,right:110},width:c.w?{size:c.w,type:D.WidthType.PERCENTAGE}:undefined});};
    const table=(rows,opt={})=>new D.Table({visuallyRightToLeft:rtl,width:{size:100,type:D.WidthType.PERCENTAGE},rows:rows.map((row,i)=>new D.TableRow({tableHeader:i===0&&opt.header!==false,cantSplit:true,children:row.map((c,j)=>cell(c,{head:i===0&&opt.header!==false,side:opt.sideHead&&j===0&&(i>0||opt.header===false),blank:opt.blank&&i>0,w:opt.widths?opt.widths[j]:undefined}))}))});
    const gap=()=>para([run("")],{after:60});
    const doc=children=>new D.Document({creator:"ومضات ذكية - Smart Sparks",styles:{default:{document:{run:{font:F,size:24,rightToLeft:rtl}}}},
      sections:[{properties:{page:{margin:{top:1600,bottom:1000,left:1000,right:1000,header:400}}},headers:{default:logoHeader()},children}]});
    return {run,runsFor,para,lines,h1,h2,h3,kv,table,gap,doc};
  };

  const T=s.tasks||[{},{}];
  const named=(s.criteria||[]).map((c,i)=>({...c,i})).filter(c=>(c.name||"").trim());
  const anyW=named.some(c=>String(c.weight||"").trim());
  const cname=c=>c.name+(anyW&&String(c.weight||"").trim()?` (${c.weight}%)`:"");

  // ---------- student file
  const sl=o.sl||"ar", S=DOC[sl];
  const k=kit(sl,sl!=="ar"&&o.gloss?o.gloss:null);
  const placeOf=(L,t)=>t.place==="other"?(t.placeOther||L.places.other):(L.places[t.place]||"");
  const st=[k.h1(S.sTitle+": "+(s.unit||""))];
  const meta=[s.subject&&(S.subject+": "+s.subject),s.grade&&(S.grade+": "+s.grade)].filter(Boolean).join("   ·   ");
  if(meta) st.push(k.para([k.run(meta,{color:GRAY})]));
  st.push(k.para([k.run(S.nameLine)],{before:120,after:200}));
  st.push(k.h2(S.whatShow),...k.lines(s.skillStudent||s.skill));
  st.push(k.h2(S.chooseOne),...k.lines(S.chooseNote));
  T.forEach((t,i)=>{
    st.push(k.h3(`${S.task[i]}: ${t.title||""}`),...k.lines(t.desc));
    st.push(k.table([[S.where,placeOf(S,t)],[S.mode,S.modes[t.mode]||""],[S.produce,t.product],[S.materials,t.materials],[S.time,t.time]],{header:false,sideHead:true,widths:[30,70]}),k.gap());
  });
  st.push(k.h2(S.howAssessed));
  st.push(k.table([[S.criterion,...S.levels],...named.map(c=>[cname(c),c.l4,c.l3,c.l2,c.l1])],{widths:[20,20,20,20,20]}));
  st.push(k.h2(S.decision));
  st.push(k.para([k.run(S.chosen+"   ",{bold:true}),k.run(`☐ ${S.task[0]}      ☐ ${S.task[1]}`)]));
  st.push(k.para([k.run(S.why+" ________________________________________________")],{before:120}));
  st.push(k.para([k.run("______________________________________________________________")],{before:120}));

  // ---------- teacher file
  const tl=o.tl||"ar", Q=DOC[tl], m=kit(tl);
  const te=[m.h1(Q.tTitle+": "+(s.unit||""))];
  te.push(m.kv(Q.subject,s.subject),m.kv(Q.grade,s.grade),m.kv(Q.unit,s.unit),m.kv(Q.coord,s.coordinator),m.kv(Q.team,s.team),m.kv(Q.date,s.date));

  te.push(m.h3(Q.evH),...m.lines(s.evidence));
  te.push(m.h2(Q.tasksH));
  const row=(label,f)=>[label,f(T[0]||{}),f(T[1]||{})];
  te.push(m.table([["",Q.task[0],Q.task[1]],row(Q.rTitle,t=>t.title),row(Q.rDesc,t=>t.desc),row(Q.rPlace,t=>placeOf(Q,t)),row(Q.mode,t=>Q.modes[t.mode]||""),
    row(Q.rProduct,t=>t.product),row(Q.materials,t=>t.materials),row(Q.rTime,t=>t.time),row(Q.rReveals,t=>t.reveals)],{sideHead:true,widths:[24,38,38]}));
  te.push(m.h2(Q.rubricH),m.table([[Q.criterion,...Q.levels],...named.map(c=>[cname(c),c.l4,c.l3,c.l2,c.l1])],{widths:[20,20,20,20,20]}));
  te.push(m.h2(Q.appearsH),m.table([[Q.criterion,...Q.inT],...named.map(c=>[c.name,c.inA,c.inB])],{widths:[24,38,38]}));
  te.push(m.h2(Q.sheetH));
  te.push(m.para([m.run(anyW?Q.formulaW:Q.totalOf(named.length*4),{size:21,color:GRAY})]));
  const head=[Q.stName,Q.taskCol,...named.map(c=>c.name),Q.total];
  te.push(m.table([head,...Array.from({length:14},()=>head.map(()=>" "))],{blank:true}));

  return {student:k.doc(st),teacher:m.doc(te)};
}

${JSON.stringify(obj)}`,{cache:false});

${JSON.stringify(obj)}`,{cache:false});

    if(!glSug.length){setStatus("glStatus",t("glNone"));return;}
    const wd=S.studentLang==="en"?"ltr":"rtl";
    $("#glSugBox").innerHTML=`<div class="gl-sug"><p class="lbl">${esc(t("glSugH"))}</p><div class="chips">${glSug.map((x,i)=>`<label><input type="checkbox" data-sg="${i}" checked><span dir="${wd}">${esc(x.w)}</span> <span class="gl-m" dir="rtl" lang="ar">${esc(x.m)}</span></label>`).join("")}</div>
      <div class="assist-actions"><button type="button" class="btn primary" id="glAddSel">${esc(t("glAddSel"))}</button><button type="button" class="btn" id="glDismiss">${esc(t("glDismiss"))}</button></div></div>`;
    setStatus("glStatus","");
  }catch(err){setStatus("glStatus",errText(err&&err.code),"err");aiFailed(err);}
  finally{const b2=$("#glSuggest");if(b2)b2.disabled=false;}
}

// ---------- boot
renderAll();go(0,false);
if(window.claude&&claude.use){
  claude.use("sample").then(s=>{sample=s;showAiButtons();if(cur===4)renderStage(4);}).catch(()=>{});
  claude.use("downloads").then(d=>{downloads=d}).catch(()=>{});
}
})();

</script>
